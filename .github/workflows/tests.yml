name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10", qt: windows}
          - {os: windows-latest, python: "3.13", qt: windows}
          - {os: macos-latest, python: "3.12", qt: offscreen}
          - {os: ubuntu-latest, python: "3.12", qt: offscreen}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt }}
      MINI_DETECT_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install ".[test]"
      - name: Tests
        run: python -m pytest -v
      - name: Install with uv as the README describes, then start the app
        shell: bash
        run: |
          python -m pip install uv
          uv tool install --python "${{ matrix.python }}" .
          python tests/launch_check.py "$(uv tool dir --bin)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-py${{ matrix.python }}
          path: screenshots
          if-no-files-found: ignore
